    <title>ELAS VendorPass™ v3</title>
    <script>
      // GitHub Pages SPA fallback
      // Stores the original path so the app can redirect back after loading
      var redirectPath = window.location.pathname;
      sessionStorage.setItem('redirectPath', redirectPath);
      // Redirect to the repo base path
      window.location.replace('/vendor-growth-compass/');
    </script>
  </head>
  <body>
    <p>Redirecionando...</p>
